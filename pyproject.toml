[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bidpilot"
version = "0.1.0"
description = "BidPilot - 招标文件到结构化技术应答初稿（带页码/原文证据链）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "python-docx>=1.1",
    "pypdf>=5.1",
    "httpx>=0.27",
    "documind",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
documind = { path = "../documind", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/bidpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

# 与 documind 保持同一套 lint 口径（同一批人维护两个仓库，规则不一致等于没有规则）
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 的 Depends 默认值写法是框架惯例；
# UP042（(str, Enum) → StrEnum）单独一轮迁移：会改变 str() 语义，且类型检查器会把
# StrEnum 成员推断成 Literal，波及 workflow/schemas 的全部状态比较。
ignore = ["E501", "B008", "UP042"]